name: worker-validation-lab
x-runtime: &runtime
  image: worker-validation-lab:local
  build: .
  init: true
  restart: unless-stopped
  environment: &environment
    DATABASE_URL: postgresql://workerlab:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/workerlab_local
    NATS_URL: nats://${NATS_USER:-workerlab}:${NATS_PASSWORD:?Set NATS_PASSWORD in .env}@queue:4222
    QUEUE_NAMESPACE: workerlab_local
    NODE_ENV: production
    RUN_MIGRATIONS_ON_START: 'false'
    QUEUE_AUTO_SETUP: 'false'
  depends_on:
    db: { condition: service_healthy }
    queue: { condition: service_started }
  stop_grace_period: 25s
services:
  db:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: workerlab
      POSTGRES_DB: workerlab_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [database:/var/lib/postgresql/data]
    ports: ['127.0.0.1:55432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U workerlab -d workerlab_local'], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
  queue:
    image: nats:2.12.11-alpine
    command: ['--jetstream', '--store_dir', '/data', '--user', '${NATS_USER:-workerlab}', '--pass', '${NATS_PASSWORD:?Set NATS_PASSWORD in .env}']
    volumes: [queue:/data]
    ports: ['127.0.0.1:14222:4222']
    restart: unless-stopped
  migrate:
    <<: *runtime
    profiles: [tools]
    restart: 'no'
    command: ['node', 'src/migrate.js']
    healthcheck: { disable: true }
  queue-setup:
    <<: *runtime
    profiles: [tools]
    restart: 'no'
    command: ['node', 'src/queue-setup.js']
    healthcheck: { disable: true }
  web:
    <<: *runtime
    environment:
      <<: *environment
      APP_ROLE: web
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      PORT: '8080'
      HOST: 0.0.0.0
    ports: ['127.0.0.1:8080:8080']
  worker:
    <<: *runtime
    environment:
      <<: *environment
      APP_ROLE: worker
      WORKER_CONCURRENCY: '1'
volumes:
  database:
  queue:
